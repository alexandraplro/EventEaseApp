<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>EventEase App</title>
    <base href="/EventEaseApp/" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
      #blazor-error-ui { display: none; position: fixed; left:0; bottom:0; width:100%; background: lightyellow; color:#111; box-shadow: 0 -1px 2px rgba(0,0,0,.2); padding:.6rem 1rem; z-index:1000; }
      #blazor-error-ui .dismiss { position:absolute; right:1rem; top:.5rem; cursor:pointer; }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <div id="blazor-error-ui">
      An unhandled error has occurred.
      <a href="" class="reload">Reload</a>
      <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
